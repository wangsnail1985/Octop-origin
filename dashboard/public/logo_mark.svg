<!-- QingAi "Q" app tile: blue-black rounded square, white Q, feathered shadow. -->
<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tileBg" x1="18" y1="18" x2="110" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1B3D74"/>
      <stop offset="0.55" stop-color="#10234E"/>
      <stop offset="1" stop-color="#070D1F"/>
    </linearGradient>
    <filter id="softShadow" x="-45%" y="-45%" width="190%" height="190%" color-interpolation-filters="sRGB">
      <!-- 毛边：大模糊低透明度 -->
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dy="5" result="softOff"/>
      <feFlood flood-color="#0A1730" flood-opacity="0.32"/>
      <feComposite in2="softOff" operator="in" result="soft"/>
      <!-- 近影：小模糊高透明度 -->
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.4"/>
      <feOffset dy="2" result="nearOff"/>
      <feFlood flood-color="#04070F" flood-opacity="0.38"/>
      <feComposite in2="nearOff" operator="in" result="near"/>
      <feMerge>
        <feMergeNode in="soft"/>
        <feMergeNode in="near"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g filter="url(#softShadow)">
    <rect x="18" y="18" width="92" height="92" rx="20" fill="url(#tileBg)"/>
    <g transform="translate(19,19) scale(0.9)">
      <circle cx="50" cy="50" r="30" fill="none" stroke="#FFFFFF" stroke-width="16"/>
      <line x1="54" y1="54" x2="78" y2="78" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round"/>
    </g>
  </g>
</svg>
